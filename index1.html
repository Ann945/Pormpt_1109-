<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt 智能寶庫</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入 PapaParse 用於解析 CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- 引入 SheetJS 用於解析本地 Excel (.xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #0f172a; /* 深色背景 (Tailwind slate-900) */
            color: #f8fafc;
        }
        /* 自訂卷軸樣式 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2 flex justify-center items-center gap-2">
                🚀 AI Prompt 智能寶庫
            </h1>
            <a href="#" class="text-sm text-gray-400 hover:text-gray-200 flex justify-center items-center gap-1 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                開啟原始資料 Google Sheet
            </a>
            
            <!-- 本地 Excel 匯入功能 -->
            <div class="mt-4 flex justify-center">
                <label for="excelUpload" class="cursor-pointer bg-slate-800 text-emerald-400 border border-emerald-500/30 hover:bg-slate-700 px-5 py-2 rounded-full text-sm font-medium transition-colors flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    匯入本地 Excel 更新資料 (.xlsx)
                </label>
                <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" class="hidden" />
            </div>
        </header>

        <!-- Search Bar -->
        <div class="max-w-2xl mx-auto mb-6 relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input type="text" id="searchInput" placeholder="搜尋提示詞..." 
                class="block w-full pl-10 pr-3 py-3 border border-slate-700 rounded-full leading-5 bg-slate-800 text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm shadow-sm transition-shadow">
        </div>

        <!-- Category Filters -->
        <div class="flex flex-wrap justify-center gap-2 mb-10" id="categoryContainer">
            <!-- Categories will be injected here -->
        </div>

        <!-- Section Title -->
        <div class="mb-6 flex items-center gap-2">
            <span class="text-2xl">🧠</span>
            <h2 class="text-xl font-bold text-white">AI 協思</h2>
        </div>

        <!-- Prompt Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="cardsContainer">
            <!-- Cards will be injected here -->
        </div>
        
        <!-- No Results Message -->
        <div id="noResults" class="hidden text-center py-10 text-gray-400">
            找不到符合條件的提示詞。
        </div>
    </div>

    <script>
        // 確實匯入您附檔的完整預設資料集 (含您後續補充與確認的內容)
        let promptsData = [
            { category: "內容創作", title: "意義單詞", content: "將文章的重點部分，尋找一個代表性英文字母，並使這些字母的首字組合成一個具有意義的單詞 (如「VISION」)" },
            { category: "內容創作", title: "品牌名稱", content: "完成 ChatGPT 角色定義後，依據“品牌定義”與“產品介紹”發想5個產品名稱與標題 (口號)。\n- 提示詞指令：描述品牌與產品，請列出數字 5個產品名稱與行銷標題建議。(*品牌定義*描述、*產品介紹*描述)\n- Prompt\n　- 我推出一個運動鞋品牌，今年銷售一款新型跑步鞋。" },
            { category: "筆記精煉", title: "長編文章", content: "為這一篇長篇文章，進行以下四個步驟，每一個步驟都提供文章與標示出來\n第1、請為這長篇文件生成一份簡短摘要。\n第2、請基於上一端摘要，不要遺漏任何專有名稱、數字或關鍵人物，重新生成一份摘要。\n第3、現在，請將摘要中每一句話都濃縮成更簡潔的表達，同時保留..." },
            { category: "筆記精煉", title: "書籍精煉", content: "請對 @[檔名]\n啟動【終極煉金管線】，一次執行四步驟整合：\n第一步：全域架構導航 (Stage 01)\n執行 stage-1-navigator，對精煉稱進行深度掃描，產出知識地圖與反宣覺預警。\n存檔：01_Map_[主題簡稱].md。\n第二步：價值 DNA 診斷 (Stage 02)" },
            { category: "筆記精煉", title: "書籍精煉", content: "我剛讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：\n\n1-底層邏輯提問：針對這段內容的「運作原理」向我提問，測試我是理解了「為什麼有效」，而非只是記住步驟。\n\n2-現狀簡化：如果這段概念有晦澀..." },
            { category: "內容創作", title: "影片清理", content: "你的角色是一位「逐字稿校對員」，不是編輯。\n任務：\n1-僅駴口語填充詞、重複說法、明顯冗詞\n2-不得改寫句型、不得改變原意、不得加入新解釋\n規則：\n1-原句順序必須完全一致\n2-若翻譯任何詞語，需保留劇前原文呈現。" },
            { category: "內容創作", title: "影片清理", content: "你的角色是一位「內容結構化整理員」，不是評論者。\n\n我會提供一段約 4000 字的影片文字內容，請你在完全保留原作者語意與立場的前提下，\n進行「保留語意的濃縮」，將內容壓縮至 約 2000 字。全文用繁體中文呈現。" }
        ];

        let allCategories = ["全部", "內容創作", "筆記精煉", "程式應用", "簡報表達", "程式生成", "文本優化", "生文校正", "專案企劃", "圖片生成", "筆記整理", "資訊整理", "心智圖法"];

        // 狀態管理
        let currentCategory = "全部";
        let searchQuery = "";

        // DOM 元素
        const categoryContainer = document.getElementById('categoryContainer');
        const cardsContainer = document.getElementById('cardsContainer');
        const searchInput = document.getElementById('searchInput');
        const noResultsMsg = document.getElementById('noResults');

        // 初始化
        function init() {
            const fetchedCategories = [...new Set(promptsData.map(item => item.category))];
            allCategories = ["全部", ...new Set([...fetchedCategories, ...allCategories.slice(1)])];
            
            renderCategories();
            renderCards();
            setupEventListeners();
        }

        // 渲染分類按鈕
        function renderCategories() {
            categoryContainer.innerHTML = '';
            allCategories.forEach(category => {
                const btn = document.createElement('button');
                const isActive = currentCategory === category;
                
                btn.className = `px-4 py-1.5 rounded-full text-sm font-medium transition-colors border shadow-sm
                    ${isActive 
                        ? 'bg-blue-600 text-white border-blue-500 hover:bg-blue-500' 
                        : 'bg-slate-800 text-gray-300 border-slate-700 hover:bg-slate-700'}`;
                btn.textContent = category;
                btn.onclick = () => {
                    currentCategory = category;
                    renderCategories();
                    renderCards();
                };
                categoryContainer.appendChild(btn);
            });
        }

        // 渲染提示詞卡片
        function renderCards() {
            cardsContainer.innerHTML = '';
            
            const filteredData = promptsData.filter(item => {
                const matchCategory = currentCategory === "全部" || item.category === currentCategory;
                const matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    item.content.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            if (filteredData.length === 0) {
                noResultsMsg.classList.remove('hidden');
            } else {
                noResultsMsg.classList.add('hidden');
                
                filteredData.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 rounded-xl shadow-lg hover:shadow-xl transition-shadow flex flex-col overflow-hidden border-t-4 border-purple-500 border-x border-b border-slate-700 relative";
                    
                    card.innerHTML = `
                        <div class="p-5 flex-grow flex flex-col">
                            <div class="mb-3">
                                <span class="inline-block px-2 py-1 bg-blue-950 text-blue-400 text-xs font-bold rounded-md mb-2 border border-blue-800/50">
                                    ${item.category}
                                </span>
                                <h3 class="text-lg font-bold text-white">${item.title}</h3>
                            </div>
                            
                            <div class="bg-slate-900 rounded-lg p-3 flex-grow overflow-y-auto custom-scrollbar relative border border-slate-700/60 h-48">
                                <pre class="text-sm text-gray-300 whitespace-pre-wrap font-sans">${item.content}</pre>
                            </div>
                        </div>
                        <div class="px-5 pb-5 pt-2">
                            <button onclick="copyPrompt(this, \`${escapeHtml(item.content)}\`)" 
                                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg transition-colors flex justify-center items-center gap-2 shadow">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                <span class="btn-text">複製 Prompt</span>
                            </button>
                        </div>
                    `;
                    cardsContainer.appendChild(card);
                });
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;")
                 .replace(/`/g, "\\`");
        }

        function copyPrompt(btnElement, text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopiedFeedback(btnElement);
                });
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopiedFeedback(btnElement);
                } catch (err) {
                    console.error('無法複製文字', err);
                }
                textArea.remove();
            }
        }

        function showCopiedFeedback(btnElement) {
            const originalHtml = btnElement.innerHTML;
            
            btnElement.classList.remove('bg-blue-600', 'hover:bg-blue-500');
            btnElement.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
            
            btnElement.innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span>已複製！</span>
            `;

            setTimeout(() => {
                btnElement.innerHTML = originalHtml;
                btnElement.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                btnElement.classList.add('bg-blue-600', 'hover:bg-blue-500');
            }, 1500);
        }

        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderCards();
            });
        }

        // 處理本地 Excel 檔案上傳
        document.getElementById('excelUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);
                    
                    promptsData = jsonData.map(row => ({
                        category: row['分類'] || row['category'] || '未分類',
                        title: row['標題'] || row['title'] || '無標題',
                        content: row['內容'] || row['content'] || ''
                    }));

                    const fetchedCategories = [...new Set(promptsData.map(item => item.category))];
                    allCategories = ["全部", ...new Set([...fetchedCategories, "內容創作", "筆記精煉", "程式應用", "簡報表達", "程式生成", "文本優化", "生文校正", "專案企劃", "圖片生成", "筆記整理", "資訊整理", "心智圖法"])];

                    currentCategory = "全部";
                    searchQuery = "";
                    searchInput.value = "";
                    renderCategories();
                    renderCards();
                    
                } catch (error) {
                    console.error("解析 Excel 失敗：", error);
                }
                e.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        });

        window.onload = init;
    </script>
</body>
</html>
